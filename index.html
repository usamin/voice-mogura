<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#7cc96b">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>こえでモグラ / Voice Mogura</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif;background:linear-gradient(#bfe9ff,#9be38a 40%);min-height:100vh;color:#4a3a2a;text-align:center;user-select:none}
.scr{display:none;padding:16px;max-width:520px;margin:auto}.scr.on{display:block}
h1{font-size:30px;margin:20px 0;color:#7a4b1e;text-shadow:2px 2px #fff}
button{font:inherit;font-size:20px;border:0;border-radius:30px;padding:14px 28px;margin:8px;background:#ff8a3d;color:#fff;box-shadow:0 5px #c2581b}
button:active{transform:translateY(4px);box-shadow:0 1px #c2581b}button.sub{background:#8a6ad8;box-shadow:0 5px #5b40a8}
.card{background:#fffbe9;border-radius:20px;padding:14px;margin:10px 0;text-align:left;font-size:18px}
.card label{display:block;margin:10px 0 4px;font-weight:bold}select,input{font:inherit;font-size:18px;width:100%;padding:6px;border-radius:10px}
#hud{display:flex;justify-content:space-between;font-size:22px;font-weight:bold}
#field{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.hole{position:relative;height:120px;overflow:hidden}
.hole:after{content:"";position:absolute;bottom:0;left:8%;width:84%;height:30px;background:#5b3a1e;border-radius:50%}
.mole{position:absolute;bottom:-110px;left:12%;width:76%;height:105px;background:#a0703f;border-radius:50% 50% 20% 20%;transition:bottom .25s;z-index:1}
.mole.up{bottom:8px}.mole .w{position:absolute;top:8px;left:-6%;width:112%;background:#fff;border:3px solid #7a4b1e;border-radius:10px;font-size:22px;font-weight:bold;padding:2px 0;color:#222;word-break:break-all}
.mole .w.sent{word-break:normal;overflow-wrap:anywhere;line-height:1.15;padding:3px 2px;left:-12%;width:124%;z-index:2}.mole .f{position:absolute;top:55px;width:100%;font-size:14px}.mole.hit{background:#ff6b6b}.mole.hit .f:after{content:"✕ ✕"}
#heard{min-height:50px;background:#fff8;border-radius:14px;padding:8px;font-size:20px}#mic{font-size:16px}
.big{font-size:60px;margin:10px}
.hole{overflow:visible}.hole{clip-path:inset(-40px -10px 0 -10px)}
.mole .tg{display:none;position:absolute;top:-30px;left:-10%;width:120%;font-size:14px;font-weight:bold;color:#c00;animation:bob .6s infinite alternate}
.mole.target.up .tg{display:block}.mole.target.up{box-shadow:0 0 0 4px #ffeb3b,0 0 18px 6px #ffeb3b}.mole.target.up .w{border-color:#e53935;background:#fffde0}
.mole.up:not(.target) .w{opacity:.85}
.mole .bub{display:none;position:absolute;top:-30px;left:-15%;width:130%;background:#4caf50;color:#fff;border-radius:10px;font-size:13px;padding:2px;z-index:3}.mole .bub.on{display:block}
@keyframes bob{to{transform:translateY(5px)}}
#lang{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:20px;font-weight:bold;font-size:17px}#lang.ja{background:#ffe0b2}#lang.en{background:#bbdefb}
.okc{color:#2e7d32}.ngc{color:#c62828}
.mole.dg,.mole.dd{background:none!important;box-shadow:none!important}.mole .ds,.mole .pts{display:none}.mole.dg .dsg,.mole.dd .dsd{display:block}
.mole .ds{position:absolute;left:-30%;bottom:-15px;width:160%;height:125px;overflow:visible;z-index:0}.mole.dg .f,.mole.dd .f{display:none}
.mole.dg .w,.mole.dd .w{top:-26px}.mole.dg .tg,.mole.dd .tg{top:-52px}.mole.dg .bub,.mole.dd .bub{top:-52px}
.mole.dg .pts,.mole.dd .pts{display:block;position:absolute;top:-38px;right:-14px;background:#ffd600;border:2px solid #b8860b;border-radius:10px;font-size:12px;font-weight:bold;padding:0 5px;z-index:4}
.mole.dd .pts{background:#00e5ff;border-color:#006064}
.mole.target.up.dg .ds,.mole.target.up.dd .ds{filter:drop-shadow(0 0 6px #ffeb3b) drop-shadow(0 0 6px #ffeb3b)}
.ds .x{display:none}.mole.hit .ds .x{display:inline}.mole.hit .ds .eye{display:none}.mole.hit .ds .bd{fill:#ff6b6b}
.glow{animation:glw 1s infinite alternate}@keyframes glw{to{opacity:.5}}
.mole .fx{display:none;white-space:nowrap;left:-20%;width:140%!important;position:absolute;top:-10px;width:100%;font-size:22px;font-weight:bold;color:#00bcd4;text-shadow:0 0 4px #fff,0 0 8px #fff;z-index:5}.mole .fx.on{display:block;animation:fxu 1s forwards}@keyframes fxu{to{transform:translateY(-40px);opacity:0}}
.hole{clip-path:inset(-64px -30px 0 -30px)!important}
#ver{position:fixed;bottom:8px;left:0;right:0;font-size:12px;color:#555}
</style></head><body>
<div id="home" class="scr on"><h1>🎤 こえで<br>モグラたたき 🔨</h1>
<p class="card">モグラがもっている<b>かんじ</b>や<b>えいご</b>を<br>こえに出して よもう！<br>ただしく よめたら ポカッ！</p>
<button id="go">スタート</button><br><button class="sub" id="toSet">せってい</button>
<p id="warn" style="color:#c00"></p><div id="ver"></div></div>
<div id="set" class="scr"><h1>せってい</h1><div class="card">
<label>がくねん</label><select id="sGrade"></select>
<label>モード</label><select id="sMode"><option value="kanji">漢字</option><option value="eng">英語</option><option value="sent">英文（ショートセンテンス）</option><option value="emix">英語＋英文</option><option value="mix">ミックス（漢字＋英語）</option></select>
<label>えいごのレベル</label><select id="sELv"><option value="same">がくねんと同じ</option><option value="7">中学英語</option><option value="8">高校英語</option></select>
<label>はんていの きびしさ</label><select id="sJudge"><option value="0">やさしい</option><option value="1">ふつう</option><option value="2">きびしい</option></select>
<label>じかん（びょう）</label><select id="sTime"><option>10</option><option>20</option><option>30</option><option>60</option><option>90</option><option>120</option></select>
<label>モグラのはやさ</label><select id="sSpeed"><option value="8000">ゆっくり</option><option value="5000">ふつう</option><option value="3500">はやい</option></select>
<label><input type="checkbox" id="sLower" style="width:auto"> 下の学年の問題もまぜる</label>
</div><button id="save">もどる</button></div>
<div id="game" class="scr"><div id="hud"><span>⭐ <b id="score">0</b></span><span>⏰ <b id="time">0</b></span></div>
<div id="lang" class="ja"></div><div id="field"></div><div id="heard">…</div><div id="mic">🎤 じゅんびちゅう</div>
<button class="sub" id="quit" style="font-size:16px;padding:8px 18px">やめる</button></div>
<div id="end" class="scr"><h1>おしまい！</h1><div class="big" id="final"></div><div class="card" id="miss"></div>
<button id="again">もういちど</button><button class="sub" id="home2">タイトル</button></div>
<script src="version.js"></script><script src="words.js"></script><script src="match.js"></script><script src="app.js"></script></body></html>
